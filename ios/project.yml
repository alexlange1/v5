# XcodeGen project spec for the Gist iOS client.
#
# This file is the source of truth for the Xcode project. The `.xcodeproj` is
# *generated* from it (and is git-ignored — see the repo `.gitignore`). After
# editing this file, regenerate with:
#
#     xcodegen generate
#
# See `ios/README.md` for the full setup flow.

name: Gist

options:
  # All generated bundle identifiers are derived from this prefix unless an
  # explicit PRODUCT_BUNDLE_IDENTIFIER overrides it (the app target does).
  bundleIdPrefix: app.gist
  # Matches `AppConfig` / `SubscriptionManager` which rely on iOS 17 APIs
  # (SwiftData, the `@Observable` macro).
  deploymentTarget:
    iOS: "17.0"
  # Keep the generated project tidy and deterministic.
  createIntermediateGroups: true
  generateEmptyDirectories: true

# ---------------------------------------------------------------------------
# Swift Package dependencies
# ---------------------------------------------------------------------------
packages:
  # RevenueCat handles StoreKit purchasing + entitlement reads on the client.
  # Only the *public* SDK key is embedded (see AppConfig); the secret REST key
  # lives exclusively in the backend.
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: 5.0.0

# ---------------------------------------------------------------------------
# Targets
# ---------------------------------------------------------------------------
targets:

  # The shipping application.
  Gist:
    type: application
    platform: iOS
    # All Swift sources + GistApp.swift live under the `Gist/` folder. Info.plist
    # and the entitlements file are referenced explicitly below, so exclude them
    # from the compiled sources to avoid duplicate-resource warnings.
    sources:
      - path: Gist
        excludes:
          - "Info.plist"
          - "Gist.entitlements"
    dependencies:
      - package: RevenueCat
    info:
      path: Gist/Info.plist
    entitlements:
      path: Gist/Gist.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.gist
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        # --- Signing placeholders ---------------------------------------------
        # Automatic signing with no team set: the project generates cleanly, but
        # a human must select their team in Xcode (Signing & Capabilities) or set
        # DEVELOPMENT_TEAM here before archiving to a device / TestFlight.
        CODE_SIGN_STYLE: Automatic
        # TODO: Set your Apple Developer Team ID (or pick the team in Xcode's
        # Signing & Capabilities tab).
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: "Apple Development"
        # Generated UIKit/SwiftUI app — no asset catalog app icon wired yet.
        GENERATE_INFOPLIST_FILE: false

  # Unit tests. Dependency-light XCTest cases (see GistTests/).
  GistTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GistTests
    dependencies:
      # The test bundle is hosted by (and links against) the app target so it
      # can import `@testable import Gist`.
      - target: Gist
    settings:
      base:
        SWIFT_VERSION: "5.9"
        # TODO: Set your Apple Developer Team ID (or pick the team in Xcode).
        DEVELOPMENT_TEAM: ""

# ---------------------------------------------------------------------------
# Schemes
# ---------------------------------------------------------------------------
schemes:
  Gist:
    build:
      targets:
        Gist: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GistTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
